name: VM exec

on:
  workflow_dispatch:
    inputs:
      cwd:
        description: Guest product folder
        required: true
        default: /home/flowforge/flowforge-projects/flowforge-booking
        type: string
      prompt:
        description: grok -p prompt (empty = status only)
        required: false
        default: ""
        type: string
      status_only:
        description: If true, print grok version + git status and exit
        required: false
        default: "false"
        type: string
      shell:
        description: Optional guest bash (diagnostics / PATH). Empty skip. HOLD-6.
        required: false
        default: ""
        type: string

jobs:
  exec:
    runs-on: self-hosted
    steps:
      - name: Guest status + optional grok
        env:
          GROK_CWD: ${{ inputs.cwd }}
          GROK_PROMPT: ${{ inputs.prompt }}
          STATUS_ONLY: ${{ inputs.status_only }}
          GUEST_SHELL: ${{ inputs.shell }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:/usr/local/bin:$PATH"
          if [[ -f "$HOME/.bashrc" ]]; then
            set +u
            # shellcheck disable=SC1091
            source "$HOME/.bashrc"
            set -u
          fi
          echo "host=$(hostname)"
          echo "user=$(whoami)"
          GROK_BIN="$(command -v grok || true)"
          if [[ -z "$GROK_BIN" ]]; then
            for p in "$HOME/.local/bin/grok" /usr/bin/grok /usr/local/bin/grok; do
              if [[ -x "$p" ]]; then GROK_BIN="$p"; break; fi
            done
          fi
          echo "grok_bin=${GROK_BIN:-MISSING}"
          if [[ -n "$GROK_BIN" ]]; then
            "$GROK_BIN" --version
          else
            echo "WARN grok not on PATH"
          fi
          if [[ -n "$GROK_CWD" && -d "$GROK_CWD" ]]; then
            cd "$GROK_CWD"
            git status -sb || true
            git rev-parse --short HEAD || true
          fi
          if [[ -n "${GUEST_SHELL:-}" ]]; then
            echo "== guest-shell =="
            bash -lc "$GUEST_SHELL"
          fi
          if [[ "$STATUS_ONLY" == "true" || -z "$GROK_PROMPT" ]]; then
            echo "status-only"
            exit 0
          fi
          if [[ -z "$GROK_BIN" ]]; then
            echo "FAIL grok missing"
            exit 1
          fi
          "$GROK_BIN" -p "$GROK_PROMPT"
